# 유틸들을 하나의 GitHub Pages 사이트로 모아 배포합니다.
#
# 왜 이런 구조인가:
# GitHub Pages 는 하나의 커스텀 도메인을 하나의 사이트에만 붙일 수 있습니다.
# 그래서 mapleland.myungwoo.kr 은 이 리포가 소유하고, 각 유틸은 여기서 체크아웃해
# `/<슬러그>` 하위 경로로 빌드한 다음 한 덩어리로 올립니다.
# 각 유틸 리포의 자체 배포(myungwoo.github.io/<repo>)는 그대로 살아 있습니다.
#
# 유틸을 추가하거나 경로를 바꿀 때는 utils.json 만 고치면 됩니다.
name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # 유틸 리포가 배포를 마치면 이쪽으로 알려 줍니다(각 리포 워크플로의 마지막 단계).
  # 이 리포에는 푸시가 없으니, 알림이 없으면 유틸 업데이트를 영영 모릅니다.
  repository_dispatch:
    types: ["utils-updated"]
  # 알림이 유실되거나 시크릿이 만료됐을 때를 위한 안전망(03:00 KST).
  # 주의: 스케줄 워크플로는 리포에 60일간 활동이 없으면 GitHub 가 자동으로 끕니다.
  # 이 리포는 조용하므로 안전망을 안전망으로만 믿을 것 — 즉시 반영은 위 알림이 담당합니다.
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Why this run
        run: |
          echo "트리거: ${{ github.event_name }}"
          echo "알린 리포: ${{ github.event.client_payload.repo || '-' }}"
          echo "알린 커밋: ${{ github.event.client_payload.sha || '-' }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 유틸 리포를 런타임에 clone 하므로 lockfile 해시를 미리 알 수 없습니다.
      # 대신 ~/.npm 을 실행마다 이어받아 설치 시간을 줄입니다.
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ github.run_id }}
          restore-keys: npm-

      - name: Build landing page
        run: node scripts/build-site.mjs

      - name: Build each utility
        run: |
          set -euo pipefail
          owner=$(jq -r '.site.owner' utils.json)
          src=$(mktemp -d)

          # 파이프로 while 을 돌리면 루프가 서브셸에서 돌아 실패를 놓치기 쉽습니다.
          mapfile -t utils < <(jq -c '.utils[]' utils.json)

          for util in "${utils[@]}"; do
            slug=$(jq -r '.slug' <<<"$util")
            repo=$(jq -r '.repo' <<<"$util")
            ref=$(jq -r '.ref' <<<"$util")

            echo "::group::$repo → /$slug"
            git clone --depth 1 --branch "$ref" \
              "https://github.com/$owner/$repo.git" "$src/$repo"

            pushd "$src/$repo" > /dev/null
            npm ci
            # 각 유틸의 next.config 가 이 환경변수로 basePath 를 정합니다.
            NEXT_PUBLIC_BASE_PATH="/$slug" npm run build
            popd > /dev/null

            if [ ! -d "$src/$repo/out" ]; then
              echo "::error::$repo 빌드 결과(out/)가 없습니다. 정적 내보내기 설정을 확인하세요."
              exit 1
            fi

            mkdir -p "dist/$slug"
            cp -R "$src/$repo/out/." "dist/$slug/"
            echo "::endgroup::"
          done

      - name: Check assembled site
        run: |
          set -euo pipefail
          missing=0
          for slug in $(jq -r '.utils[].slug' utils.json); do
            if [ ! -f "dist/$slug/index.html" ]; then
              echo "::error::dist/$slug/index.html 이 없습니다."
              missing=1
            elif ! grep -q "/$slug/_next" "dist/$slug/index.html"; then
              echo "::error::dist/$slug/index.html 의 에셋 경로가 /$slug 하위가 아닙니다 (basePath 주입 실패)."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "완성된 사이트:"
          du -sh dist
          ls -1 dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
